[project]
name = "oracle"
version = "0.1.0"
description = "Personal dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "feedparser>=6.0",
    "python-multipart>=0.0.29",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.0",
    "pywebview>=5.0",
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "ruff>=0.15.13",
]
