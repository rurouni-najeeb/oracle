<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="40%" style="stop-color:#2d5a87"/>
      <stop offset="100%" style="stop-color:#1a3352"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#7ec8e3;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#4a90d9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a3352;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b8e4f0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4a90d9;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#4a90d9" stroke-width="8" opacity="0.4"/>
  <!-- Orb -->
  <circle cx="512" cy="512" r="220" fill="url(#orb)"/>
  <!-- Glow highlight -->
  <circle cx="512" cy="512" r="220" fill="url(#glow)"/>
  <!-- Inner specular -->
  <circle cx="460" cy="440" r="80" fill="url(#innerGlow)"/>
  <!-- Orbit rings -->
  <ellipse cx="512" cy="512" rx="320" ry="120" fill="none" stroke="#7ec8e3" stroke-width="3" opacity="0.5" transform="rotate(-20, 512, 512)"/>
  <ellipse cx="512" cy="512" rx="320" ry="120" fill="none" stroke="#7ec8e3" stroke-width="3" opacity="0.3" transform="rotate(40, 512, 512)"/>
  <!-- Small dots on orbit -->
  <circle cx="280" cy="420" r="12" fill="#7ec8e3" opacity="0.8"/>
  <circle cx="740" cy="600" r="10" fill="#7ec8e3" opacity="0.6"/>
  <circle cx="620" cy="280" r="8" fill="#b8e4f0" opacity="0.7"/>
</svg>
