<h2>Repositories</h2>

<details class="repo-manage">
    <summary class="repo-manage-toggle">Manage</summary>
    <form hx-post="/github/repositories/add" hx-target="#repositories-panel > div" hx-swap="innerHTML" class="repo-add-form">
        <input type="text" name="repository" placeholder="owner/repo or URL" required class="repo-path-input">
        <input type="text" name="display_name" placeholder="Name" class="repo-name-input">
        <button type="submit" class="repo-add-btn">Add</button>
    </form>
</details>

{% if error %}
<p class="error-state">{{ error }}</p>
{% endif %}

{% if repositories %}
<ul class="repo-list">
    {% for repo in repositories %}
    <li class="repo-shortcut">
        <div class="repo-heading">
            <a href="{{ repo.url }}" target="_blank" rel="noopener noreferrer" class="repo-title">{{ repo.label }}</a>
            <form hx-post="/github/repositories/remove" hx-target="#repositories-panel > div" hx-swap="innerHTML" class="repo-remove-form">
                <input type="hidden" name="url" value="{{ repo.url }}">
                <button type="submit" class="repo-remove-btn" aria-label="Remove repository">
                    <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                        <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </form>
        </div>
        <div class="repo-full-name">{{ repo.full_name }}</div>
        <div class="repo-actions">
            <a href="{{ repo.url }}/pulls" target="_blank" rel="noopener noreferrer">Pulls</a>
            <a href="{{ repo.url }}/actions" target="_blank" rel="noopener noreferrer">Actions</a>
            <a href="{{ repo.url }}/issues" target="_blank" rel="noopener noreferrer">Issues</a>
        </div>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="empty-state">No repositories pinned.</p>
{% endif %}
