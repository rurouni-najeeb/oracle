<h2>Notes</h2>

<form hx-post="/scratchpad/add" hx-target="#scratchpad-panel > div" hx-swap="innerHTML" class="note-add-form">
    <input type="text" name="content" placeholder="Add a note..." required class="note-input">
    <button type="submit" class="note-add-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
</form>

{% if notes %}
<ul class="note-list">
    {% for note in notes %}
    <li class="note-item" id="note-{{ note.id }}">
        <form hx-post="/scratchpad/update" hx-target="#scratchpad-panel > div" hx-swap="innerHTML" class="note-edit-form">
            <input type="hidden" name="note_id" value="{{ note.id }}">
            <input type="text" name="content" value="{{ note.content }}" class="note-edit-input">
        </form>
        <form hx-post="/scratchpad/delete" hx-target="#scratchpad-panel > div" hx-swap="innerHTML" class="note-delete-form">
            <input type="hidden" name="note_id" value="{{ note.id }}">
            <button type="submit" class="note-delete-btn" aria-label="Delete note">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="empty-state">No notes yet.</p>
{% endif %}
